# Local PostgreSQL for Murasaki. Start it with:
#   docker compose up -d db
# The credentials match server/.env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: murasaki
      POSTGRES_PASSWORD: murasaki
      POSTGRES_DB: murasaki
    ports:
      - '5432:5432'
    volumes:
      - murasaki-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U murasaki']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  murasaki-data:
